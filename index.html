<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saliha için ❤️</title>
<style>
:root{--bg1:#ffe3ec;--bg2:#ffb3c9;--text:#7a1034;--heart:#e0245e;--card:rgba(255,255,255,.75);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a0a18;--bg2:#5a1230;--text:#ffd9e5;--heart:#ff4d86;--card:rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg1:#2a0a18;--bg2:#5a1230;--text:#ffd9e5;--heart:#ff4d86;--card:rgba(0,0,0,.4)}
html,body{height:100%;margin:0}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--text);font-family:Georgia,"Times New Roman",serif;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.box{position:relative;z-index:2;padding:24px;max-width:480px}
.big{font-size:84px;display:inline-block;animation:beat 1.2s infinite;filter:drop-shadow(0 6px 14px rgba(224,36,94,.45))}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}
h1{font-size:clamp(34px,9vw,56px);margin:8px 0;color:var(--heart)}
p{font-size:19px;line-height:1.5;margin:8px 0}
button{margin-top:18px;font:inherit;font-size:18px;color:#fff;background:var(--heart);border:0;border-radius:999px;padding:14px 28px;cursor:pointer;box-shadow:0 8px 20px rgba(224,36,94,.4)}
button:active{transform:scale(.96)}
#note{display:none;margin-top:20px;background:var(--card);border-radius:18px;padding:18px;animation:pop .6s ease}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:none}}
.f{position:fixed;bottom:-40px;z-index:1;pointer-events:none;animation:up linear forwards}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
</style>
</head>
<body>
<div class="box">
  <div class="big">❤️</div>
  <h1>Saliha</h1>
  <p>Senin için küçük bir sürprizim var…</p>
  <button id="b">Dokun 💌</button>
  <div id="note">
    <p>İyi ki varsın, iyi ki hayatımdasın.</p>
    <p>Seninle her gün daha güzel. Seni çok seviyorum! 💕</p>
  </div>
</div>
<script>
var E=["❤️","💖","💕","💗","🌹"];
function heart(){
  var s=document.createElement("span");
  s.className="f";
  s.textContent=E[Math.floor(Math.random()*E.length)];
  s.style.left=Math.random()*100+"vw";
  s.style.fontSize=(16+Math.random()*28)+"px";
  s.style.animationDuration=(5+Math.random()*5)+"s";
  document.body.appendChild(s);
  setTimeout(function(){s.remove()},10500);
}
setInterval(heart,350);
document.getElementById("b").onclick=function(){
  document.getElementById("note").style.display="block";
  this.style.display="none";
  for(var i=0;i<30;i++)setTimeout(heart,i*60);
};
</script>
</body>
</html>
